[project]
name = "embedding-service"
version = "0.1.0"
description = "gRPC server for vector embeddings using sentence transformers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "sentence-transformers>=5.3.0",
    "transformers>=5.5.0",
    "torch>=2.0.0",
    "numpy>=2.4.0",
    "zvec==0.2.1",
    "polars[pyarrow]>=1.39.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.7",
]


[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

