[workspace]
resolver = "2"
members = [
  "topictrend_core",
  "topictrend_cli",
  "topictrend_web",
  "topictrend_taxonomy",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96.0"

[workspace.dependencies]
parquet = "59"
parquet_derive = "59.0"
dotenv = "0.15"
polars = { version = "0.54.4", features = [
  "lazy",
  "parquet",
  "strings",
] }
roaring = { version = "0.11", features = [] }
anyhow = "1.0"
ahash = "0.8"
clap = { version = "4", features = ["derive"] }
rayon = "1.11"
chrono = "0.4"
byteorder = "1.5"
regex = "1"

[profile.dev]
# Faster compile times, slightly slower runtime
opt-level = 0
debug = 1  # line tables only (not full debug)
incremental = true



