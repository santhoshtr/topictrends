[package]
name = "topictrend_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# default-run = "wikigraph"

[[bin]]
name = "wikigraph"
path = "src/main.rs"

[[bin]]
name = "get-categories"
path = "src/etl/categories.rs"

[[bin]]
name = "get-articles"
path = "src/etl/articles.rs"

[[bin]]
name = "get-categorygraph"
path = "src/etl/category_graph.rs"

[[bin]]
name = "get-article_category"
path = "src/etl/article_category.rs"

[[bin]]
name = "get-pageviews"
path = "src/etl/pageviews.rs"

[[bin]]
name = "get-per_day_wiki_stats"
path = "src/etl/per_day_wiki_stats.rs"

[[bin]]
name = "get-day-pageedits"
path = "src/etl/day_pageedits.rs"

[[bin]]
name = "get-gsc-qid-date"
path = "src/etl/google_search_data.rs"

[[bin]]
name = "coverage-matrix"
path = "src/etl/coverage_matrix.rs"

[[bin]]
name = "coverage-articles"
path = "src/coverage_articles.rs"

[[bin]]
name = "article-categories"
path = "src/article_categories.rs"

[dependencies]
topictrend_core = { path = "../topictrend_core" }
parquet = { workspace = true }
parquet_derive = { workspace = true }
polars = { workspace = true }
anyhow = { workspace = true }
ahash = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
rayon = { workspace = true }
byteorder = { workspace = true }
roaring = { workspace = true }

[[bin]]
name = "coverage-gaps"
path = "src/coverage_gaps.rs"

[[bin]]
name = "canonical-membership"
path = "src/etl/canonical_membership.rs"

[[bin]]
name = "canonical-projection"
path = "src/etl/canonical_projection.rs"

[[bin]]
name = "canonical-labels"
path = "src/etl/canonical_labels.rs"
