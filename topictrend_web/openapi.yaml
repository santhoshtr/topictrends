openapi: 3.1.0

info:
  title: TopicTrends HTTP API
  description: |
    TopicTrends HTTP API exposed by the Axum web server.

    Notes:
    - All endpoints are `GET` and accept parameters via query string.
    - Dates are encoded as `YYYY-MM-DD`.
    - Error responses are returned as JSON: `{ "error": "..." }`.
  version: 0.1.0

servers:
  - url: https://topictrends.wmcloud.org
    description: Production
  - url: http://localhost:8765
    description: Local development

tags:
  - name: Pageviews
    description: Pageview trend endpoints
  - name: Pageedits
    description: Page edit trend endpoints
  - name: GoogleSearch
    description: Google search trend endpoints
  - name: Delta
    description: Delta analysis endpoints
  - name: Search
    description: Semantic category search endpoints
  - name: Lists
    description: Listing and graph helper endpoints

paths:
  /api/pageviews/category:
    get:
      operationId: getCategoryPageviewTrend
      tags: [Pageviews]
      summary: Category pageview trend
      description: Daily pageviews for a category (optionally including subcategories).
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/CategoryQidOptional"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryTrendResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pageviews/article:
    get:
      operationId: getArticlePageviewTrend
      tags: [Pageviews]
      summary: Article pageview trend
      description: Daily pageviews for an article.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/Article"
        - $ref: "#/components/parameters/ArticleQidOptional"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleTrendResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pageedits/category:
    get:
      operationId: getCategoryPageeditTrend
      tags: [Pageedits]
      summary: Category page edit trend
      description: Daily edits for a category (optionally including subcategories).
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/CategoryQidOptional"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEditTrendResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pageedits/article:
    get:
      operationId: getArticlePageeditTrend
      tags: [Pageedits]
      summary: Article page edit trend
      description: Daily edits for an article.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/Article"
        - $ref: "#/components/parameters/ArticleQidOptional"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleEditTrendResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/googlesearch/category:
    get:
      operationId: getCategoryGoogleSearchTrend
      tags: [GoogleSearch]
      summary: Category Google search trend
      description: Daily Google search metrics for a category (optionally including subcategories).
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/CategoryQidOptional"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSearchCategoryTrendResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/googlesearch/article:
    get:
      operationId: getArticleGoogleSearchTrend
      tags: [GoogleSearch]
      summary: Article Google search trend
      description: Daily Google search metrics for an article.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/Article"
        - $ref: "#/components/parameters/ArticleQidOptional"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSearchArticleTrendResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/list/sub_categories:
    get:
      operationId: listSubCategories
      tags: [Lists]
      summary: List subcategories
      description: |
        Returns subcategories for a category, sorted by title — QID, local
        title and (for non-English wikis) the English label for each.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/CategoryQidOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryInfo"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pageviews/top_categories:
    get:
      operationId: getPageviewsTopCategories
      tags: [Pageviews]
      summary: Top categories by pageviews
      description: Returns top categories ranked by total pageviews in the period.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
        - $ref: "#/components/parameters/TopNOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryRankResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pageviews/top_articles:
    get:
      operationId: getPageviewsTopArticles
      tags: [Pageviews]
      summary: Top articles by pageviews
      description: Returns globally top viewed articles for the period.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
        - $ref: "#/components/parameters/TopNOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageViewTopArticlesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pageedits/top_categories:
    get:
      operationId: getPageeditsTopCategories
      tags: [Pageedits]
      summary: Top categories by page edits
      description: Returns top categories ranked by total edit count in the period.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
        - $ref: "#/components/parameters/TopNOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEditRankResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pageedits/top_articles:
    get:
      operationId: getPageeditsTopArticles
      tags: [Pageedits]
      summary: Top articles by page edits
      description: Returns globally top edited articles for the period.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
        - $ref: "#/components/parameters/TopNOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageEditTopArticlesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/googlesearch/top_categories:
    get:
      operationId: getGooglesearchTopCategories
      tags: [GoogleSearch]
      summary: Top categories by Google search clicks
      description: Returns top categories ranked by total Google Search clicks in the period.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
        - $ref: "#/components/parameters/TopNOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySearchRankResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/googlesearch/top_articles:
    get:
      operationId: getGooglesearchTopArticles
      tags: [GoogleSearch]
      summary: Top articles by Google search clicks
      description: Returns globally top searched articles for the period.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/StartDateOptional"
        - $ref: "#/components/parameters/EndDateOptional"
        - $ref: "#/components/parameters/TopNOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSearchTopArticlesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pageviews/delta/categories:
    get:
      operationId: getCategoryPageviewDelta
      tags: [Delta]
      summary: Category pageview delta
      description: Delta of category pageviews between a baseline and an impact period.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/BaselineStartDate"
        - $ref: "#/components/parameters/BaselineEndDate"
        - $ref: "#/components/parameters/ImpactStartDate"
        - $ref: "#/components/parameters/ImpactEndDate"
        - $ref: "#/components/parameters/LimitOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageViewCategoryDeltaResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pageviews/delta/articles:
    get:
      operationId: getArticlePageviewDelta
      tags: [Delta]
      summary: Article pageview delta
      description: Delta of article pageviews within a category between two periods.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/CategoryQidRequired"
        - $ref: "#/components/parameters/BaselineStartDate"
        - $ref: "#/components/parameters/BaselineEndDate"
        - $ref: "#/components/parameters/ImpactStartDate"
        - $ref: "#/components/parameters/ImpactEndDate"
        - $ref: "#/components/parameters/LimitOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageViewArticleDeltaResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pageedits/delta/categories:
    get:
      operationId: getCategoryPageeditDelta
      tags: [Delta]
      summary: Category page edit delta
      description: Delta of category edits between a baseline and an impact period.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/BaselineStartDate"
        - $ref: "#/components/parameters/BaselineEndDate"
        - $ref: "#/components/parameters/ImpactStartDate"
        - $ref: "#/components/parameters/ImpactEndDate"
        - $ref: "#/components/parameters/LimitOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageEditCategoryDeltaResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pageedits/delta/articles:
    get:
      operationId: getArticlePageeditDelta
      tags: [Delta]
      summary: Article page edit delta
      description: Delta of article edits within a category between two periods.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/CategoryQidRequired"
        - $ref: "#/components/parameters/BaselineStartDate"
        - $ref: "#/components/parameters/BaselineEndDate"
        - $ref: "#/components/parameters/ImpactStartDate"
        - $ref: "#/components/parameters/ImpactEndDate"
        - $ref: "#/components/parameters/LimitOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageEditArticleDeltaResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/googlesearch/delta/categories:
    get:
      operationId: getCategoryGoogleSearchDelta
      tags: [Delta, GoogleSearch]
      summary: Category Google search delta
      description: Delta of category search clicks between a baseline and an impact period.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/BaselineStartDate"
        - $ref: "#/components/parameters/BaselineEndDate"
        - $ref: "#/components/parameters/ImpactStartDate"
        - $ref: "#/components/parameters/ImpactEndDate"
        - $ref: "#/components/parameters/LimitOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSearchCategoryDeltaResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/googlesearch/delta/articles:
    get:
      operationId: getArticleGoogleSearchDelta
      tags: [Delta, GoogleSearch]
      summary: Article Google search delta
      description: Delta of article search clicks within a category between two periods.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/CategoryQidRequired"
        - $ref: "#/components/parameters/BaselineStartDate"
        - $ref: "#/components/parameters/BaselineEndDate"
        - $ref: "#/components/parameters/ImpactStartDate"
        - $ref: "#/components/parameters/ImpactEndDate"
        - $ref: "#/components/parameters/LimitOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSearchArticleDeltaResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/search/categories:
    get:
      operationId: searchCategories
      tags: [Search]
      summary: Semantic search for categories
      description: Searches categories (embedding-based) and returns matches above a threshold.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/MatchThresholdOptional"
        - $ref: "#/components/parameters/SearchLimitOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySearchResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/list/articles:
    get:
      operationId: listArticlesInCategory
      tags: [Lists]
      summary: List articles in category
      description: |
        Returns article QIDs (direct members only) and titles for a category.

        Note: at least one of `category` or `category_qid` must be provided.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/CategoryOptional"
        - $ref: "#/components/parameters/CategoryQidOptional"
        - name: min_agreement
          in: query
          required: false
          description: >
            Keep only members whose direct membership edge is asserted by at
            least this many Wikipedia editions (default 1). Meaningful when the
            server runs on the canonical cross-wiki topology; on local topology
            every edge counts as 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlesInCategoryResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/list/article_categories:
    get:
      operationId: listArticleCategories
      tags: [Lists]
      summary: List categories for an article
      description: |
        Returns all categories that an article belongs to.

        Note: at least one of `article` or `article_qid` must be provided.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/ArticleOptional"
        - $ref: "#/components/parameters/ArticleQidOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleCategoriesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/related/articles:
    get:
      operationId: getRelatedArticles
      tags: [Lists]
      summary: Find related articles by shared-category overlap
      description: |
        Returns the articles that share the most categories with the given
        article, ranked by overlap. Each result includes the title, a
        constructed Wikipedia URL, and the shared-category count (`score`).

        Runs entirely on the in-memory category graph. Note: at least one of
        `article` or `article_qid` must be provided.
      parameters:
        - $ref: "#/components/parameters/Wiki"
        - $ref: "#/components/parameters/ArticleOptional"
        - $ref: "#/components/parameters/ArticleQidOptional"
        - $ref: "#/components/parameters/LimitOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedArticlesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/content_gap/categories:
    get:
      operationId: getContentGapCategories
      tags: [ContentGap]
      summary: Content gap for one category across wikis
      description: |
        Compares one category's coverage across the requested wikis. Each
        wiki's `article_count` is the category's `qid_overlap_coverage` from
        the monthly coverage snapshot — how many of the category's
        globally-known articles exist in that wiki — the same measure the
        gap-discovery ranking uses.

        Either `category` (an enwiki title) or `category_qid` must be provided.
      parameters:
        - $ref: "#/components/parameters/CategoryOptional"
        - $ref: "#/components/parameters/CategoryQidOptional"
        - $ref: "#/components/parameters/Wikis"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGapResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gap_discovery/categories:
    get:
      operationId: getGapDiscovery
      tags: [ContentGap]
      summary: Rank categories where a target wiki lags a reference wiki
      description: |
        From the precomputed coverage matrix, finds the categories whose
        canonical articles the reference edition has and the target lacks
        (`gap = qid_overlap(reference) - qid_overlap(target)`). By default rows are
        ranked by estimated missing readership
        `overlap_pageviews × gap / overlap_reference` — average monthly views per
        reference article times the missing-article count — which demotes bot stub
        farms. These are the *reference* wiki's pageviews (a global-importance
        proxy), not traffic the target would inherit. Set `weight=false` for a raw
        missing-article-count ranking. Maintenance / content-organization
        categories are excluded server-side. Supports skip/limit pagination, a
        `min_ref` floor (to drop tiny noise), and a structure filter
        (`has_category`: `false` = category absent in target, `true` = present but
        under-populated).

        If the reference snapshot predates the pageview column the request
        silently falls back to the raw gap ranking and `weighted_applied` is
        `false`.
      parameters:
        - name: reference
          in: query
          required: true
          schema: { type: string }
          description: Reference (baseline) wiki, e.g. enwiki.
        - name: target
          in: query
          required: true
          schema: { type: string }
          description: Target (analysed) wiki, e.g. mlwiki.
        - name: skip
          in: query
          required: false
          schema: { type: integer, default: 0 }
          description: Skip the top N ranked rows (alias of `offset`).
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
        - name: min_ref
          in: query
          required: false
          schema: { type: integer }
        - name: has_category
          in: query
          required: false
          schema: { type: boolean }
        - name: weight
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Rank by estimated missing readership (default); set false for a raw missing-article-count ranking.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapDiscoveryResponse"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    Wiki:
      name: wiki
      in: query
      required: true
      description: Wikipedia edition database name (e.g., `enwiki`, `mlwiki`).
      schema:
        type: string
        minLength: 1

    Wikis:
      name: wikis
      in: query
      required: true
      description: Comma-separated list of Wikipedia edition database names (e.g., `enwiki,frwiki,dewiki`).
      schema:
        type: string
        minLength: 1

    Category:
      name: category
      in: query
      required: true
      description: Category title in the given wiki (without the `Category:` prefix).
      schema:
        type: string
        minLength: 1

    CategoryOptional:
      name: category
      in: query
      required: false
      description: Category title in the given wiki (without the `Category:` prefix).
      schema:
        type: string
        minLength: 1

    Article:
      name: article
      in: query
      required: true
      description: Article title in the given wiki.
      schema:
        type: string
        minLength: 1

    ArticleOptional:
      name: article
      in: query
      required: false
      description: Article title in the given wiki.
      schema:
        type: string
        minLength: 1

    Query:
      name: query
      in: query
      required: true
      description: Search query string.
      schema:
        type: string
        minLength: 1

    CategoryQidOptional:
      name: category_qid
      in: query
      required: false
      description: Wikidata QID as a numeric ID (e.g., `42` for Q42).
      schema:
        type: integer
        format: int32
        minimum: 0

    CategoryQidRequired:
      name: category_qid
      in: query
      required: true
      description: Wikidata QID as a numeric ID (e.g., `42` for Q42).
      schema:
        type: integer
        format: int32
        minimum: 0

    ArticleQidOptional:
      name: article_qid
      in: query
      required: false
      description: Wikidata QID as a numeric ID (e.g., `42` for Q42).
      schema:
        type: integer
        format: int32
        minimum: 0

    LimitOptional:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 0

    TopNOptional:
      name: top_n
      in: query
      required: false
      description: Number of top categories to return.
      schema:
        type: integer
        format: int32
        minimum: 0

    MatchThresholdOptional:
      name: match_threshold
      in: query
      required: false
      description: Minimum match score threshold.
      schema:
        type: number
        format: float
        minimum: 0
        maximum: 1

    SearchLimitOptional:
      name: limit
      in: query
      required: false
      description: Maximum number of search candidates to consider.
      schema:
        type: integer
        format: int64
        minimum: 0

    StartDateOptional:
      name: start_date
      in: query
      required: false
      description: Start date (inclusive).
      schema:
        type: string
        format: date

    EndDateOptional:
      name: end_date
