      required: [category_qid, category_title, direct_coverage_target, overlap_target, overlap_reference, gap, coverage_pct, has_category, overlap_pageviews, weighted_score]
      properties:
        category_qid:
          type: integer
          format: int32
        category_title:
          type: string
          description: Category title resolved from the reference wiki (or `Q<id>` fallback)
        category_title_en:
          type: string
          description: English label for the same QID, resolved from English Wikipedia with the canonical-label fallback. Present only when the requested wiki is not enwiki and a label exists.
        direct_coverage_target:
          type: integer
          format: int32
          description: Articles filed directly under the category in the target wiki
        overlap_target:
          type: integer
          format: int32
          description: Canonical articles of the category present in the target wiki
        overlap_reference:
          type: integer
          format: int32
          description: Canonical articles of the category present in the reference wiki
        gap:
          type: integer
          format: int64
          description: overlap_reference - overlap_target
        coverage_pct:
          type: number
          format: double
          description: overlap_target / overlap_reference
        has_category:
          type: boolean
          description: Whether the target wiki has the category populated (direct_coverage_target > 0)
        overlap_pageviews:
          type: integer
          format: int64
          description: Windowed pageviews of the category's reference-side overlap articles (0 when unweighted)
        weighted_score:
          type: integer
          format: int64
          description: Estimated missing readership, overlap_pageviews × gap / overlap_reference (0 when unweighted)

    GapDiscoveryResponse:
      type: object
      required: [reference, target, reference_date, target_date, total, with_category, without_category, offset, limit, weighted, weighted_applied, categories]
      properties:
        reference:
          type: string
        target:
          type: string
        reference_date:
          type: string
          description: Reference snapshot date (YYYY-MM-DD)
        target_date:
          type: string
          description: Target snapshot date (YYYY-MM-DD)
        total:
          type: integer
          description: Total gaps matching the filters (before skip/limit)
        with_category:
          type: integer
          description: Of the filtered set, rows where the target has the category
        without_category:
          type: integer
          description: Of the filtered set, rows where the target lacks the category
        offset:
          type: integer
        limit:
          type: integer
        weighted:
          type: boolean
          description: Whether pageview weighting was requested
        weighted_applied:
          type: boolean
          description: Whether weighting was actually applied (false if the reference snapshot predates the pageview column)
        categories:
          type: array
          items:
            $ref: "#/components/schemas/GapDiscoveryItem"

