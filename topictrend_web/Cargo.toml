[package]
name = "topictrend_web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]

[dependencies]
topictrend_core = { path = "../topictrend_core" }
topictrend_taxonomy = { path = "../topictrend_taxonomy" }
chrono = { workspace = true }
axum = "0.8"
axum-macros = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
roaring = { workspace = true }
tokio = { version = "1.48", features = [
  "rt-multi-thread",  # async runtime
  "macros",           # #[tokio::main]
  "net",              # TCP/networking for axum
  "time",             # time utilities
  "sync",             # channels, mutexes
] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
tera = "1.20"
once_cell = "1.20"
env_logger = "0.11"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
polars = { workspace = true }
rmcp = { version = "1.3", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
schemars = { version = "1", features = ["chrono04"] }
