{% extends "base.html" %}

{% block title %}Topic Trends - Most Searched Categories{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/pageviews-top-categories.css">
{% endblock %}

{% block content %}
<div class="app-container">
  <div class="form-container">
    <h2>Most Searched Categories</h2>
    <form-filler>
    <form id="top-form">
      <div class="header-wiki-selector">
        {% include "wiki-selector.html" %}
      </div>
      <date-range-picker min-date="2015-07-01">
        <input type="date" id="start_date" name="start-date" data-role="start" class="cdx-text-input__input">
        <input type="date" id="end_date" name="end-date" data-role="end" class="cdx-text-input__input">
      </date-range-picker>
      <div class="form-item">
        <label for="top_n">Number of categories</label>
        <input name="top_n" id="top_n" value="100" class="cdx-text-input__input" type="number" min="1" max="200">
      </div>
      <div class="form-item">
        <button type="submit"
          class="cdx-button cdx-button--action-progressive cdx-button--weight-primary">Show</button>
      </div>
    </form>
    </form-filler>
    <p id="status" class="status"></p>
  </div>
  <div class="main" data-metric="googlesearch">
    <div id="results" class="results"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/components/date-range-picker.js" type="module"></script>
<script src="/static/components/wiki-article-info.js" type="module"></script>
<script src="/static/components/form-filler.js" type="module"></script>
<script src="/static/top-categories-page.js" type="module"></script>
{% endblock %}
